        "weather":
          "$ref": "#/components/schemas/WeatherSnapshot"
        "engine_version":
          "type": "string"
        "rules_version":
          "type": "string"
        "shortfall_reasons":
          "type": "array"
          "items":
            "type": "string"
        "created_at":
          "type": "string"
          "format": "date-time"
        "expires_at":
          "type": "string"
          "format": "date-time"
        "target_date":
          "type": "string"
          "format": "date"
          "description": "생성 시 사용자 timezone의 오늘 날짜"
      "description": "status=ready이면 outfits 1~3, insufficient_wardrobe이면 빈 배열. requested_count 미만이면 shortfall_reasons로 설명한다."
      "allOf":
        - 
          "if":
            "properties":
              "status":
                "const": "ready"
            "required":
              - "status"
          "then":
            "properties":
              "outfits":
                "minItems": 1
        - 
          "if":
            "properties":
              "status":
                "const": "insufficient_wardrobe"
            "required":
              - "status"
          "then":
            "properties":
              "outfits":
                "maxItems": 0
              "shortfall_reasons":
                "minItems": 1
