                "$ref": "#/components/schemas/TpoList"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "security": []
  "/me/aesthetics":
    "put":
      "operationId": "replaceAestheticPreferences"
      "tags":
        - "Profile"
      "summary": "선호 추구미 1~3개 교체"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/Preferences"
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Preferences"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/garment-batches":
    "post":
      "operationId": "createGarmentBatch"
      "tags":
        - "Ingestion"
      "summary": "서버 경로 생성 및 signed upload 발급"
      "parameters":
        - 
          "$ref": "#/components/parameters/IdempotencyKey"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/BatchCreate"
      "responses":
        "201":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BatchCreated"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "413":
          "$ref": "#/components/responses/PayloadTooLarge"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "description": "URL 만료 후에는 upload-url로 재발급. 응답 headers/method를 그대로 Storage에 사용."
  "/garment-batches/{batchId}":
    "get":
      "operationId": "getGarmentBatch"
      "tags":
        - "Ingestion"
      "summary": "배치 상태 조회"
      "parameters":
        - 
          "$ref": "#/components/parameters/BatchId"
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Batch"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/garment-batches/{batchId}/upload-url":
    "post":
      "operationId": "refreshUploadUrl"
      "tags":
        - "Ingestion"
      "summary": "업로드 전 signed URL 재발급"
      "parameters":
        - 
          "$ref": "#/components/parameters/BatchId"
      "responses":
        "200":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/SignedUpload"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "description": "awaiting_upload만 허용. 동일 object key에 upsert false; 업로드된 객체 덮어쓰기 금지."
  "/garment-batches/{batchId}/complete-upload":
    "post":
      "operationId": "completeGarmentUpload"
      "tags":
        - "Ingestion"
      "summary": "실제 객체 검증 후 업로드 완료"
      "parameters":
        - 
          "$ref": "#/components/parameters/BatchId"
        - 
          "$ref": "#/components/parameters/IdempotencyKey"
      "responses":
        "200":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Batch"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "413":
          "$ref": "#/components/responses/PayloadTooLarge"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/Unavailable"
      "description": "서버가 Storage 존재/크기/MIME/magic bytes 및 디코딩 가능 여부 확인. 이미 uploaded면 재호출 성공."
  "/garment-batches/{batchId}/analysis-jobs":
    "post":
      "operationId": "createAnalysisJob"
      "tags":
        - "Ingestion"
      "summary": "내구성 있는 DB 분석 Job 생성"
      "parameters":
        - 
          "$ref": "#/components/parameters/BatchId"
        - 
          "$ref": "#/components/parameters/IdempotencyKey"
      "responses":
        "202":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AnalysisJob"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "description": "analysis_jobs 자체가 내구성 있는 DB 큐다. uploaded 배치와 job 생성을 한 트랜잭션으로 처리. 기존 job은409; 실패 재시도는 retry 경로 이용."
  "/analysis-jobs/{jobId}":
    "get":
      "operationId": "getAnalysisJob"
      "tags":
        - "Ingestion"
      "summary": "분석 상태 폴링"
      "parameters":
        - 
          "$ref": "#/components/parameters/JobId"
      "responses":
        "200":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AnalysisJob"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "description": "초기 2초, 최대10초 backoff. terminal 상태에서 중단."
  "/analysis-jobs/{jobId}/retry":
    "post":
      "operationId": "retryAnalysisJob"
      "tags":
        - "Ingestion"
      "summary": "실패한 작업 재시도"
      "parameters":
        - 
          "$ref": "#/components/parameters/JobId"
        - 
          "$ref": "#/components/parameters/IdempotencyKey"
      "responses":
        "202":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AnalysisJob"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "description": "failed이고 retryable, attempt<max_attempts일 때만 허용. 같은 job을 queued로 되돌리고 실제 claim 시 attempt 증가. partial_failed는 재시도 대상이 아니며 성공 draft를 검토/확정하거나 새 배치에서 재촬영한다. confirmed batch는409."
  "/garment-batches/{batchId}/drafts":
    "get":
      "operationId": "listGarmentDrafts"
      "tags":
        - "Ingestion"
      "summary": "검토 결과 조회"
      "parameters":
        - 
          "$ref": "#/components/parameters/BatchId"
      "responses":
        "200":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/DraftList"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "description": "부분 성공도 반환. draft당 predicted_attributes는 불변, current_attributes는 수정 가능."
  "/garment-drafts/{draftId}":
    "patch":
      "operationId": "updateGarmentDraft"
      "tags":
        - "Ingestion"
      "summary": "예측 원본을 보존하고 draft 수정"
      "parameters":
        - 
          "$ref": "#/components/parameters/DraftId"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/DraftPatch"
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GarmentDraft"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/garment-batches/{batchId}/confirm":
    "post":
      "operationId": "confirmGarmentBatch"
      "tags":
        - "Ingestion"
      "summary": "선택 draft를 원자적으로 옷장 확정"
      "parameters":
        - 
          "$ref": "#/components/parameters/BatchId"
        - 
          "$ref": "#/components/parameters/IdempotencyKey"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ConfirmBatch"
      "responses":
        "201":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ConfirmResult"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "description": "검토 가능 terminal job만 허용. 모든 소유권/버전 확인, garments 생성과 draft confirmed/batch confirmed를 한 트랜잭션 처리. 선택 안 된 draft는 rejected. 부분 실패 결과 확정하면 해당 batch 재분석 불가."
  "/garments":
    "get":
      "operationId": "listGarments"
      "tags":
        - "Closet"
      "summary": "내 옷장 페이지"
      "parameters":
        - 
          "$ref": "#/components/parameters/Cursor"
        - 
          "$ref": "#/components/parameters/Limit"
        - 
          "name": "category"
          "in": "query"
          "schema":
            "$ref": "#/components/schemas/GarmentCategory"
      "responses":
        "200":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GarmentPage"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "description": "created_at DESC,id DESC. 삭제된 의류 제외."
  "/garments/{garmentId}":
    "get":
      "operationId": "getGarment"
      "tags":
        - "Closet"
      "summary": "의류 상세"
      "parameters":
        - 
          "$ref": "#/components/parameters/GarmentId"
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Garment"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
