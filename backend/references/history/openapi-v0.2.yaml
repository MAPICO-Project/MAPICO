        - "status"
        - "requested_count"
        - "outfits"
        - "tpo"
        - "weather"
        - "engine_version"
        - "rules_version"
        - "shortfall_reasons"
        - "created_at"
        - "expires_at"
        - "target_date"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "status":
          "type": "string"
          "enum":
            - "ready"
            - "insufficient_wardrobe"
        "requested_count":
          "type": "integer"
          "minimum": 1
          "maximum": 3
        "outfits":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Outfit"
          "maxItems": 3
        "tpo":
          "anyOf":
            - 
