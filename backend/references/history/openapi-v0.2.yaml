      "summary": "의류 속성 수정"
      "parameters":
        - 
          "$ref": "#/components/parameters/GarmentId"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/GarmentPatch"
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Garment"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    "delete":
      "operationId": "deleteGarment"
      "tags":
        - "Closet"
      "summary": "의류 숨김 및 자산 정리 예약"
      "parameters":
        - 
          "$ref": "#/components/parameters/GarmentId"
        - 
          "$ref": "#/components/parameters/IdempotencyKey"
      "responses":
        "202":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/DeleteAccepted"
          "headers":
