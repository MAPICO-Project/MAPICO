# OpenAPI 3.1 — historical M0.5 contract, 2026-09-27; latest PRD reconciliation pending
"openapi": "3.1.0"
"info":
  "title": "마피코 API (이전 M0.5 설계)"
  "version": "0.2.0"
  "description": "M0.5 구현용 계약 초안. 서버 구현과 원격 Supabase 배포가 완료되었다는 의미가 아니다. /api/v1 경유. feed/mimic/swap/public OOTD는 후속 범위."
"servers":
  - 
    "url": "/api/v1"
"security":
  - 
    "bearerAuth": []
"tags":
  - 
    "name": "Profile"
  - 
    "name": "Catalog"
  - 
    "name": "Ingestion"
  - 
    "name": "Closet"
  - 
    "name": "Weather"
  - 
    "name": "Recommendation"
  - 
    "name": "OOTD"
  - 
    "name": "Internal"
"paths":
  "/me":
    "get":
      "operationId": "getMe"
      "tags":
        - "Profile"
      "summary": "내 프로필 조회"
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Profile"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
    "patch":
      "operationId": "updateMe"
      "tags":
        - "Profile"
      "summary": "프로필 변경"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ProfilePatch"
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Profile"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/aesthetics":
    "get":
      "operationId": "listAesthetics"
      "tags":
        - "Catalog"
      "summary": "활성 추구미 카탈로그"
