  "/internal/analysis-jobs/{jobId}/result":
    "post":
      "operationId": "receiveAnalysisResult"
      "tags":
        - "Internal"
      "summary": "Worker terminal 결과 수신"
      "parameters":
        - 
          "$ref": "#/components/parameters/JobId"
        - 
          "name": "X-Worker-Timestamp"
          "in": "header"
          "required": true
          "schema":
            "type": "integer"
            "minimum": 1
          "description": "Unix seconds. 서버와 ±300초 이내."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AnalysisCallback"
      "responses":
        "200":
          "description": "요청 처리 결과"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CallbackAccepted"
          "headers":
            "X-Request-Id":
              "schema":
                "type": "string"
                "format": "uuid"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationError"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
      "security":
        - 
          "workerSignature": []
      "description": "HMAC-SHA256(timestamp+'.'+raw_body), hex signature. 결과 body job은 path에 바인딩된 lease와 검증. event_id unique + payload hash; identical replay returns applied=false. attempt mismatch/terminal overwrite409. 같은 event 다른 payload409. 성공은1~6 items/errors0, partial은1~6 items/errors>=1, failed는items0/errors>=1. 경로 prefix/객체 존재/범위 검사 후 원자 적용. body.job_id=path jobId; lease_token+attempt가 현재 running lease와 일치하고 만료 전이어야 한다. Worker에는 DB service key를 주지 않는다."
"components":
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "Supabase JWT"
      "description": "서버에서 signature/issuer/audience/expiry 검증. user_id는 sub에서만 취득."
    "workerSignature":
      "type": "apiKey"
      "in": "header"
      "name": "X-Worker-Signature"
      "description": "HMAC SHA256(timestamp+'.'+raw body) hex. JWT만으로 내부 callback 접근 불가."
  "parameters":
    "BatchId":
      "name": "batchId"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "JobId":
      "name": "jobId"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "DraftId":
      "name": "draftId"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "GarmentId":
      "name": "garmentId"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "RecommendationId":
      "name": "recommendationId"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "OotdId":
      "name": "ootdId"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "IdempotencyKey":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "minLength": 8
        "maxLength": 128
        "pattern": "^[A-Za-z0-9._:-]+$"
      "description": "사용자+operation 범위, 24시간 보존. 같은 canonical body는 동일 HTTP status/body 재생; 다른 body는409. 처리 중이면409 REQUEST_IN_PROGRESS."
    "Cursor":
      "name": "cursor"
      "in": "query"
      "schema":
        "type": "string"
        "maxLength": 1024
      "description": "불투명 keyset 커서. 필터와 정렬 변경 시 재사용 금지."
    "Limit":
      "name": "limit"
      "in": "query"
      "schema":
        "type": "integer"
        "minimum": 1
        "maximum": 100
        "default": 20
  "responses":
    "BadRequest":
      "description": "400 JSON 파싱/쿼리 형식 오류"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorResponse"
    "Unauthorized":
      "description": "401 토큰 또는 내부 서명 검증 실패"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorResponse"
    "Forbidden":
      "description": "403 허용되지 않은 작업"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorResponse"
    "NotFound":
      "description": "404 없음 또는 타인 소유. 소유 여부 노출 금지"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorResponse"
    "Conflict":
      "description": "409 상태/버전/멱등 키 충돌"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorResponse"
    "PayloadTooLarge":
      "description": "413 허용 이미지 크기 초과"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorResponse"
    "ValidationError":
      "description": "422 필드/도메인 검증 실패"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorResponse"
    "RateLimited":
      "description": "429 요청 제한"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorResponse"
      "headers":
        "Retry-After":
          "schema":
            "type": "integer"
            "minimum": 1
          "description": "초 단위 재시도 대기"
    "Unavailable":
      "description": "503 날씨/저장소 등 의존 서비스 장애"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ErrorResponse"
    "InternalError":
      "description": "500 내부 오류; 비밀값/스택 노출 금지"
      "content":
