                "type": "null"
              }
            ],
            "description": "아이템 등급. 내부 점수 >= 0.75 high, >= 0.5 medium, 그 미만 low(SQL g10_mimic_grade). 매칭 없음은 null. 숫자 점수는 남의 옷 속성 추정을 막기 위해 응답하지 않는다."
          },
          "reason": {
            "type": "string",
            "maxLength": 500
          }
        }
      },
      "MimicResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "post_id",
          "status",
          "matches",
          "model_version",
          "coverage",
          "grade",
          "error"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "post_id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "queued",
              "running",
              "succeeded",
              "no_match",
              "failed"
            ]
          },
          "matches": {
            "type": "array",
            "maxItems": 10,
            "items": {
              "$ref": "#/components/schemas/MimicMatch"
            }
          },
          "model_version": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^[A-Za-z0-9._:-]{1,100}$",
                "maxLength": 100
              },
              {
                "type": "null"
              }
            ]
          },
          "coverage": {
            "anyOf": [
              {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "grade": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "high",
                  "medium",
                  "low"
                ]
              },
              {
                "type": "null"
              }
            ],
            "description": "전체 등급. 연결 아이템 전체의 내부 점수 평균(매칭 없음 = 0)에 아이템과 같은 임계값을 적용한다. succeeded에서만 값이 있고 그 외 null."
          },
          "error": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/ErrorDetail"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "description": "2026-10-10부터 포스트 연결 아이템 ↔ 내 옷장 아이템을 규칙 기반(rule-v1: 같은 카테고리 필수, 색 0.4·패턴 0.3·추구미 0.3, 0.2 미만 미매칭, 옷장 아이템 1개는 한 번만 배정)으로 동기 매칭하므로 생성 응답이 곧 succeeded/no_match다. 대표 이미지는 재분석하지 않는다. 같은 모델의 garment_embeddings가 있으면 rule-v1-vector로 혼합한다. 점수는 내부에만 보관하고 응답은 등급(high/medium/low)과 coverage만 준다. source_item_key와 reason은 BFF가 비식별·서버 문구로 재투영한다. succeeded도 일부 unmatched 가능. no_match는 등록 CTA. 저장은 사용자가 매칭을 확인 후 owned garment IDs로 saved-outfits POST."
      },
